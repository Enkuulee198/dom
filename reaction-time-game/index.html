<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

<div class="flex flex-1 items-center justify-center py-10">
        <!-- Endees ehel -->
         <div class="w-[576px] h-[575px] rounded-[24px] border-[1px] border-[#27272A] bg-[#18181B] pl-[32px]">
          <div class="mt-[32px] text-[#F4F4F5] font-['Inter'] font-semibold text-[24px] leading-[100%] tracking-normal ">Reaction time</div>
          <div class="mt-[8px] text-[#A1A1AA] font-['Inter'] font-normal text-[14px] leading-[24px] tracking-normal">Wait for green, then click as quickly as you can.</div>
          <button id="gameBox" class="mt-[24px] w-[512px] h-[256px] rounded-[16px] bg-[#27272A] flex flex-col justify-center items-center gap-[12px]">
            <img src="Frame.png" alt="logo">
            <p id="gameMessage" class="font-['Inter'] font-semibold text-[24px] leading-[100%] tracking-normal">Ready when you are</p>
            <p id="gameSubmessage" class="font-['Inter'] font-normal text-[14px] leading-[100%] tracking-normal">Click to start</p>
          </button>
          <div class="gap-[4px] flex pt-[24px]">
            <div class="w-[250px] h-[84px] rounded-[12px] bg-[#27272A] flex flex-col justify-center items-center gap-[4px]">
              <div id="lastAttempt" class="font-['Inter'] font-normal text-[24px] leading-[100%] tracking-normal text-[#D9F99D]">150ms</div>
              <p class="font-['Inter'] font-normal text-[12px] leading-[100%] tracking-normal text-[#A1A1AA]" >Last attempt</p>
            </div>
            <div class="w-[250px] h-[84px] rounded-[12px] bg-[#27272A] flex flex-col justify-center items-center gap-[4px]">
              <div id="bestSession" class="font-['Inter'] font-normal text-[24px] leading-[100%] tracking-normal text-[#D9F99D]">99ms</div>
              <p class="font-['Inter'] font-normal text-[12px] leading-[100%] tracking-normal text-[#A1A1AA]" >Best this session</p>              
            </div>
          </div>
          <p class="font-['Inter'] font-normal text-[12px] leading-[20px] tracking-normal text-center text-[#A1A1AA] mt-[20px] ml-[-32px]">Click the panel, or focus it and press Space or Enter. Clicking before green ends the<p>
          <p class="font-['Inter'] font-normal text-[12px] leading-[20px] tracking-normal text-center text-[#A1A1AA] ml-[-32px]">attempt.<p>
         </div>
      </div>
    </div>
  </body>
</html>
